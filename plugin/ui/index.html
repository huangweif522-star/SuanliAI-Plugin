<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>算力 AI 视频 v1.1.4</title>
  <style>
    :root { color-scheme:dark; background:#202124; }
    * { box-sizing:border-box; letter-spacing:0; }
    #settingsForm [hidden] { display:none !important; }
    body { --suanli-bg:#202124; --suanli-panel:#292b30; --suanli-inset:#24262a; --suanli-control:#303236; --suanli-text:#e6e8ed; --suanli-muted:#aeb4bf; --suanli-line:#494d56; --suanli-accent:#8aa9d2; color-scheme:dark; margin:0; padding:12px; font:13px/1.55 system-ui,"Microsoft YaHei",sans-serif; color:var(--suanli-text); background:var(--suanli-bg); }
    form { display:grid; gap:10px; max-width:720px; min-width:0; margin:auto; }
    h1 { margin:0; font-size:17px; line-height:1.4; font-weight:650; } h2 { font-size:14px; margin:0; font-weight:600; }
    .topline,.row { display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; min-width:0; }
    .topline { padding:1px 1px 4px; }
    .version,.muted,.hint { color:var(--suanli-muted); font-size:12px; overflow-wrap:anywhere; }
    .version { font-variant-numeric:tabular-nums; }
    .panel { --suanli-section:#78899f; min-width:0; border:1px solid var(--suanli-line); border-radius:6px; padding:11px; background:var(--suanli-panel); }
    section.panel { display:grid; gap:10px; }
    .panel h2,.panel summary { position:relative; padding-left:10px; }
    .panel h2::before,.panel summary::before { content:""; position:absolute; left:0; top:.3em; bottom:.3em; width:3px; border-radius:2px; background:var(--suanli-section); }
    .connection-panel { --suanli-section:#8190a4; }
    .model-panel { --suanli-section:#8aa9d2; border-color:#56647a; }
    .generation-panel { --suanli-section:#8ca799; }
    .reference-panel { --suanli-section:#a296b1; }
    .waiting-panel { --suanli-section:#ad9e81; }
    .plugin-version-panel { --suanli-section:#8c9db4; }
    .pair { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; min-width:0; }
    label { display:grid; gap:5px; min-width:0; color:#d5d9e0; }
    input,select,textarea,button { font:inherit; color:var(--suanli-text); color-scheme:dark; }
    input,select,textarea { width:100%; min-width:0; padding:7px 8px; border:1px solid #565b65; border-radius:4px; background:var(--suanli-control); }
    input::placeholder,textarea::placeholder { color:#929aa8; opacity:1; }
    select { text-overflow:ellipsis; } option { background:var(--suanli-control); color:var(--suanli-text); }
    input:focus,select:focus,textarea:focus,button:focus-visible { outline:2px solid var(--suanli-accent); outline-offset:1px; }
    input[type="checkbox"] { accent-color:var(--suanli-accent); }
    textarea { resize:vertical; }
    button { min-width:0; max-width:100%; border:1px solid #5c626e; border-radius:4px; padding:5px 9px; background:#34373d; cursor:pointer; }
    button:hover { border-color:#94a7c0; background:#3b4049; } button:disabled { opacity:.55; cursor:wait; }
    .primary { color:#edf3fc; background:#435975; border-color:#728aa9; font-weight:600; }
    .primary:hover { background:#4d6584; border-color:#99b1d1; }
    #catalogInfo { padding:5px 8px; background:var(--suanli-inset); border:1px solid #3e444e; border-radius:4px; }
    .search-label { position:relative; } .search-label input { padding-right:34px; }
    #modelSearch::-webkit-search-cancel-button { -webkit-appearance:none; appearance:none; }
    .clear-search { position:absolute; right:3px; bottom:3px; border:0; padding:4px 8px; background:transparent; font-size:17px; line-height:1.3; color:#bdc7d7; }
    .results { display:grid; gap:6px; max-height:286px; min-width:0; overflow-y:auto; overscroll-behavior:contain; padding:2px; border-radius:4px; scrollbar-color:#606773 #24262a; }
    .model-option { display:block; text-align:left; width:100%; min-width:0; padding:8px; white-space:normal; overflow-wrap:anywhere; background:#303236; border-color:#4c525d; }
    .model-option[aria-pressed="true"] { border-color:#a4c7f2; background:#354a65; box-shadow:inset 4px 0 #b0d0fa,0 0 0 1px #6686af; }
    .model-meta { display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin-bottom:4px; font-size:11px; color:#b7bfcd; }
    .chip { padding:0 5px; border:1px solid #59616f; border-radius:3px; background:#292e36; }
    .selected-marker,.current-model-badge { display:inline-flex; align-items:center; gap:3px; padding:1px 6px; border:1px solid #8eb5e6; border-radius:3px; background:#3b587a; color:#e5f1ff; font-size:11px; font-weight:600; white-space:nowrap; }
    .selected-marker { margin-left:auto; }
    .current-title { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .model-name { display:block; line-height:1.6; white-space:normal; overflow-wrap:anywhere; } mark { background:#6c5e37; color:#fff0bc; border-radius:2px; }
    .current-box { display:grid; gap:6px; min-width:0; padding:9px; border:1px solid #505969; border-radius:4px; background:var(--suanli-inset); }
    .current-box[data-selected="true"] { border-color:#9dbfe9; background:#2e4058; box-shadow:inset 3px 0 #a3c7f5; }
    .current-box strong { font-size:12px; color:#cbd6e8; }
    #currentModel { resize:none; font-size:12px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; background:#2c3037; border-color:#555f6e; }
    .current-box[data-selected="true"] #currentModel { border-color:#758eaf; background:#26374c; color:#edf5ff; }
    #selectionStatus { font-size:12px; color:var(--suanli-muted); overflow-wrap:anywhere; }
    .empty { text-align:center; padding:22px 8px; color:var(--suanli-muted); }
    .status { font-size:12px; white-space:pre-wrap; overflow-wrap:anywhere; color:#b8c4d7; }
    .status:empty { display:none; }
    .status[data-state="error"] { color:#f2aaa5; } .status[data-state="success"] { color:#a1d2ae; }
    .check { display:flex; align-items:center; gap:7px; } .check input { width:16px; height:16px; flex:0 0 16px; margin:0; }
    .small-button { font-size:12px; padding:3px 8px; }
    details summary { display:flex; justify-content:space-between; align-items:center; gap:8px; cursor:pointer; font-size:14px; font-weight:600; list-style:none; }
    details summary::-webkit-details-marker { display:none; }
    details summary::after { content:"＋"; color:#9da7b6; font-size:14px; font-weight:400; }
    details[open] summary::after { content:"−"; }
    details[open] summary { margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #424752; }
    details[open] summary::before { bottom:calc(.3em + 8px); }
    .detail-content { display:grid; gap:10px; min-width:0; }
    .footer-hint { padding:0 2px 2px; font-size:11px; }
    .plugin-version-value { color:#d9e7fa; font-weight:600; font-variant-numeric:tabular-nums; }
    .version-actions { display:flex; flex-wrap:wrap; gap:8px; }
    .version-actions button { flex:1 1 100px; }
    .release-notes { white-space:pre-wrap; overflow-wrap:anywhere; max-height:220px; overflow-y:auto; padding:8px; border:1px solid #454f60; border-radius:4px; background:var(--suanli-inset); font-size:12px; }
    .release-link { display:inline-block; width:fit-content; max-width:100%; color:#b7d4fa; text-decoration:underline; text-underline-offset:3px; font-size:12px; }
    .release-link:focus-visible { outline:2px solid var(--suanli-accent); outline-offset:2px; }
    @media(max-width:380px) { body { padding:9px; } .panel { padding:10px; } .pair { gap:8px; } .results { max-height:266px; } .topline { gap:5px; } .version { font-size:11px; } }
    @media(max-width:300px) { .pair { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<form id="settingsForm" onsubmit="return false">
  <div class="topline"><h1>算力 AI 视频</h1><span class="version">v1.1.4</span></div>
  <details class="panel connection-panel" id="connectionSettings" open>
    <summary>接口设置</summary>
    <div class="detail-content">
      <label>API 令牌<input id="api_key" data-param type="password" autocomplete="off" spellcheck="false" placeholder="填写算力 AI 令牌"></label>
      <label>接口地址<input id="base_url" data-param type="url" value="https://suanliai.top/v1" spellcheck="false"></label>
    </div>
  </details>
  <section class="panel model-panel" aria-labelledby="modelHeading">
    <div class="row"><h2 id="modelHeading">模型检索</h2><button id="updateModels" type="button" class="primary">更新模型</button></div>
    <div id="catalogInfo" class="muted">内置列表 · 111 个模型</div>
    <div class="pair">
      <label>模型分类<select id="familyFilter"><option value="">全部分类</option></select></label>
      <label>来源系列<select id="seriesFilter"><option value="">全部系列</option></select></label>
    </div>
    <label class="search-label">关键词搜索<input id="modelSearch" type="search" autocomplete="off" spellcheck="false" placeholder="粘贴模型名，或输入 sd2.5 720p 30图"><button id="clearQuery" class="clear-search" type="button" aria-label="清空关键词" title="清空关键词">×</button></label>
    <div class="hint">多个关键词用空格隔开，匹配全部条件；分类依据模型名称。</div>
    <div class="row"><span id="resultCount" class="muted" role="status" aria-live="polite"></span><button id="resetFilters" type="button" class="small-button">清空筛选</button></div>
    <div id="modelResults" class="results" role="group" aria-label="匹配的模型"></div>
    <div class="current-box" id="currentSelection" data-selected="true">
      <div class="row"><div class="current-title"><strong>当前已选模型</strong><span id="currentModelBadge" class="current-model-badge">✓ 已选</span></div><button id="copyModel" type="button" class="small-button">复制名称</button></div>
      <input id="model" data-param type="hidden" value="专享sd2.0(fast933/4-15秒/720p)">
      <textarea id="currentModel" rows="2" readonly aria-label="当前模型完整名称"></textarea>
      <div id="selectionStatus"></div>
    </div>
    <div id="modelStatus" class="status" role="status" aria-live="polite"></div>
  </section>
  <section class="panel generation-panel" aria-labelledby="generationHeading">
    <h2 id="generationHeading">生成设置</h2>
    <label>生成模式<select id="generation_mode" data-param><option>文生视频</option><option>首帧生成视频</option><option selected>多参考图生成视频</option></select></label>
    <div class="pair">
      <label>时长（秒）<select id="duration" data-param>
        <option value="15">15 秒</option><option value="30" selected>30 秒（默认）</option>
      </select></label>
      <label>画幅比例<select id="aspect_ratio" data-param><option>16:9</option><option selected>9:16</option><option>1:1</option><option>4:3</option><option>3:4</option><option>21:9</option><option>3:2</option><option>2:3</option></select></label>
    </div>
    <div class="hint">生成时长按上方选择的 15 秒或 30 秒提交，请选择支持对应时长的模型。</div>
    <label>分辨率<select id="resolution" data-param><option>480p</option><option selected>720p</option><option>1080p</option></select></label>
    <div class="pair"><label class="check"><input id="generate_audio" data-param type="checkbox">生成声音</label><label class="check"><input id="face" data-param type="checkbox">过脸处理</label></div>
  </section>
  <details class="panel reference-panel">
    <summary>参考素材</summary>
    <div class="detail-content">
      <label>参考视频（每行一个 URL 或本地路径）<textarea id="videos" data-param rows="2" spellcheck="false"></textarea></label>
      <label>参考音频（每行一个 URL 或本地路径）<textarea id="audios" data-param rows="2" spellcheck="false"></textarea></label>
    </div>
  </details>
  <details class="panel waiting-panel">
    <summary>等待设置</summary>
    <div class="detail-content">
      <div class="pair"><label>查询间隔（秒）<input id="poll_interval" data-param type="number" min="1" step="1" value="5"></label><label>最长等待（秒）<input id="timeout" data-param type="number" min="1" step="1" value="3600"></label></div>
    </div>
  </details>
  <section class="panel plugin-version-panel" aria-labelledby="pluginVersionHeading">
    <div class="row"><h2 id="pluginVersionHeading">插件版本</h2><span class="muted">当前版本 <span id="pluginCurrentVersion" class="plugin-version-value">v1.1.4</span></span></div>
    <div class="version-actions"><button id="checkPluginUpdate" type="button">检查更新</button><button id="downloadPluginUpdate" type="button" class="primary" disabled>下载新版</button></div>
    <div id="pluginVersionInfo" class="muted"></div>
    <div id="pluginUpdateStatus" class="status" role="status" aria-live="polite">点击“检查更新”获取最新版本信息。</div>
    <details id="pluginReleaseDetails" hidden>
      <summary>更新说明</summary>
      <div class="detail-content"><div id="pluginReleaseNotes" class="release-notes"></div><a id="pluginReleaseLink" class="release-link" target="_blank" rel="noopener noreferrer" hidden>查看发布页</a></div>
    </details>
    <div class="hint">仅在点击时检查或下载。下载完成后，按安装说明替换插件并重启软件。</div>
  </section>
  <div class="hint footer-hint">筛选只改变显示结果；点击模型才会切换选择。模型实际能力以平台说明为准。</div>
</form>
<script src="models-builtin.js"></script>
<script src="model-search.js"></script>
<script src="plugin-sdk.js"></script>
<script src="app.js"></script>
</body>
</html>
